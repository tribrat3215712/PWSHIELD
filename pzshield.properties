# PZShield 1.1.1 — Build 42.21, revision 4a0e9546ec; exact input SHA-256 pinned in CorePatcher.
# UTF-8. Place next to projectzomboid.jar or use -Dpzshield.config=<absolute-path>.
shield.enabled=true

# FIFO snapshots and processing deadlines; the remaining suffix is deferred, not dropped.
# Cumulative shares: HIGH 50%, PLAYER 80%, VEHICLE 100%.
# At least one packet is processed per nonempty phase, even when the budget is exceeded.
# A single slow packet handler can still exceed this budget.
queueProtection.enabled=true
queueProtection.networkBudgetMs=70

# Memory quotas for outstanding packet buffers, including packets in extracted batches.
# Cost is buffer capacity + 128 bytes of bookkeeping allowance; this is not a full JVM heap bound.
# Exceeding a quota disconnects the sender rather than silently dropping reliable transactions.
queues.maxBufferedBytes=67108864
queues.maxConnectionBytes=8388608
pool.maxRetainedBuffers=4096

firewall.enabled=true
firewall.validateVehiclePhysics=true

# Optional per-GUID packet/byte token buckets. Zero/zero disables a dimension.
# Fill these from real traffic measurements. No universal PPS baseline is assumed.
# enforce=false records would-limit events; true disconnects the sender on a violation.
rateLimits.enabled=true
rateLimits.enforce=false
rateLimits.guid.packetsPerSecond=0
rateLimits.guid.burstPackets=0
rateLimits.guid.bytesPerSecond=0
rateLimits.guid.burstBytes=0
rateLimits.maxTrackedGuids=16384
rateLimits.stateTtlSeconds=300

# Daemon-thread metrics; cumulative counters, UTC timestamps, CSV rotates at 10 MiB.
# Current CSV plus one previous CSV is retained.
performance.enabled=true
performance.intervalSeconds=5
performance.csvPath=logs/pzshield-performance.csv
logging.console=true
